[project]
name = "snapui-agent"
version = "0.1.0"
description = "SnapUI Agent 服务"
readme = "README.md"
authors = [
    { name = "TOTChan", email = "ckw990620@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-core>=1.6.1",
    "langchain-deepseek>=1.0",
    "langchain-openai>=1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.0",
    "pymilvus>=2.4",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

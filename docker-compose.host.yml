# Linux 云服务器的独立配置：运行时共用宿主机网络，绕过异常的桥接出站路径。
# 单独使用本文件，不与 docker-compose.yml 或 DNS 附加文件合并。
services:
  app:
    image: snapui-agent:${IMAGE_TAG:-local}
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      # host 模式直接使用宿主机端口，因此显式限制为本机访问。
      AGENT_HOST: "127.0.0.1"
      AGENT_PORT: "${AGENT_PUBLISH_PORT:-8000}"
      INTERNAL_AUTH_MODE: "${INTERNAL_AUTH_MODE:-enforce}"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?请在 .env.docker 配置与 OCRServer 一致的内部密钥}"
    # 镜像默认探测 8000；host 模式需跟随实际监听端口。
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['AGENT_PORT'] + '/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
